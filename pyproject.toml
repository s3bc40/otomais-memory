[project]
name = "otomais-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.13",
    "djangorestframework>=3.17.1",
    "environs>=15.0.1",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "ruff>=0.15.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "otomais.settings"
pythonpath = ["."]
