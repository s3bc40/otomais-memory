name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "false"
        with:
          mode: simulation
          run: uv run pytest encyclopedia/tests/test_benchmarks.py --codspeed
