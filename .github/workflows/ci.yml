name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: "false"
        # --tb=short -- trims the traceback on failures to just the relevant lines, cleaner output in CI logs
        # -q -- quiet mode, suppresses the per-test dots/names and only shows the summary line at the end
        run: uv run pytest --tb=short -q
